<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar e-mail — ByClick</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../css/login.css"><link rel="stylesheet" href="../css/byclick-system.css">
</head>
<body><main style="max-width:440px;margin:10vh auto;padding:32px;background:#fff;border:1px solid #e8dfd0;border-radius:16px;font-family:system-ui,sans-serif"><a href="../" style="color:#c84b1f;text-decoration:none;font-weight:800">ByClick</a><h1 style="margin:24px 0 12px">Verifica o teu e-mail</h1><p>Introduz o código de seis dígitos que enviámos para o teu e-mail.</p><form id="form" style="display:grid;gap:16px;margin-top:24px"><label for="codigo">Código de verificação</label><input id="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required style="padding:14px;border:1px solid #ddd;border-radius:8px;font-size:18px"><button type="submit" style="padding:14px;border:0;border-radius:8px;background:#c84b1f;color:white;font-weight:700;cursor:pointer">Confirmar código</button><p id="estado" role="status"></p></form><a href="../login/">Ir para o login</a></main><script src="../js/api.js"></script><script>
document.getElementById('form').addEventListener('submit', async e => { e.preventDefault(); const estado = document.getElementById('estado'); const id = Number(new URLSearchParams(location.search).get('id')); if (!id) { estado.textContent = 'Não foi possível identificar a conta.'; return; } const button = e.target.querySelector('button'); button.disabled = true; const result = await verificarCodigo(id, document.getElementById('codigo').value, 'email'); if (result.success) { estado.textContent = 'E-mail confirmado. A abrir o login...'; setTimeout(() => location.href = '../login/', 1200); } else { estado.textContent = result.error || 'Código inválido ou expirado.'; button.disabled = false; } });
</script></body></html>
